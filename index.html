<body>

<div class="header">
  <div class="logo" id="hLogo"></div>
  <div class="header-text">
    <h1 id="hName"></h1>
    <p id="hTagline"></p>
  </div>
  <div class="header-right">
    <div class="lang-toggle">
      <button class="lang-btn active" id="btnHI" onclick="setLang('hi')">HI</button>
      <button class="lang-btn" id="btnEN" onclick="setLang('en')">EN</button>
    </div>
    <div class="badge" id="hBadge">FREE</div>
  </div>
</div>

<div class="container">

  <div class="company-card">
    <div class="company-card-title" id="contactTitle"></div>
    <div class="company-info">
      <div class="info-item">📞 <span id="cPhone"></span></div>
      <div class="info-item">🌐 <span id="cWeb"></span></div>
      <div class="info-item" style="grid-column:span 2">📍 <span id="cAddr"></span></div>
    </div>
    <div class="contact-btns">
      <button class="contact-btn btn-call" id="btnCall"></button>
      <button class="contact-btn btn-wa" id="btnWA"></button>
      <button class="contact-btn btn-web" id="btnWeb"></button>
      <button class="contact-btn btn-loc" id="btnLoc"></button>
    </div>
  </div>

  <div class="emi-calculator">
    <div class="emi-title" id="emiTitle"></div>
    <div class="emi-inputs">
      <input class="emi-input" id="principal" type="number" placeholder="Loan ₹">
      <input class="emi-input" id="rate" type="number" placeholder="Interest %">
      <input class="emi-input" id="tenure" type="number" placeholder="Months">
    </div>
    <button class="calc-btn" id="calcBtn" onclick="calcEMI()"></button>
    <div class="emi-result" id="emiResult"></div>
  </div>

  <div class="section-label" id="secLabel"></div>
  <div class="loan-grid" id="loanGrid"></div>

  <div class="chat-box" id="chatBox">
    <div class="msg bot">
      <div class="msg-avatar" id="botAvatar"></div>
      <div class="msg-bubble" id="welcomeMsg"></div>
    </div>
  </div>

  <div class="input-row">
    <input type="text" id="userInput" onkeypress="if(event.key==='Enter')sendMsg()">
    <button class="send-btn" id="sendBtn" onclick="sendMsg()">➤</button>
  </div>

  <button class="apply-btn" id="applyBtn"></button>
  <div class="disclaimer" id="disclaimer"></div>

</div>

<script>
let currentLang = 'hi';

function setLang(lang) {
  currentLang = lang;
  const L = LANG[lang];
  document.getElementById('hLogo').textContent = COMPANY.logo;
  document.getElementById('hName').textContent = COMPANY.name;
  document.getElementById('hTagline').textContent = L.tagline;
  document.getElementById('hBadge').style.background = COMPANY.color;
  document.getElementById('contactTitle').textContent = L.contactTitle;
  document.getElementById('cPhone').textContent = COMPANY.phone;
  document.getElementById('cWeb').textContent = COMPANY.website;
  document.getElementById('cAddr').textContent = COMPANY.address;
  document.getElementById('btnCall').textContent = L.callBtn;
  document.getElementById('btnCall').onclick = () => window.open('tel:'+COMPANY.phone);
  document.getElementById('btnWA').textContent = L.waBtn;
  document.getElementById('btnWA').onclick = () => window.open('https://wa.me/'+COMPANY.whatsapp);
  document.getElementById('btnWeb').textContent = L.webBtn;
  document.getElementById('btnWeb').onclick = () => window.open('https://'+COMPANY.website);
  document.getElementById('btnLoc').textContent = L.locBtn;
  document.getElementById('btnLoc').onclick = () => alert(COMPANY.address);
  document.getElementById('emiTitle').textContent = L.emiTitle;
  document.getElementById('emiTitle').style.color = COMPANY.color;

function calcEMI() {
  const p = parseFloat(document.getElementById('principal').value);
  const r = parseFloat(document.getElementById('rate').value)/12/100;
  const n = parseFloat(document.getElementById('tenure').value);
  const result = document.getElementById('emiResult');
  if (!p||!r||!n) {
    result.style.display='block';
    result.style.color='#fbbf24';
    result.innerHTML = LANG[currentLang].emiError;
    return;
  }
  const emi = (p*r*Math.pow(1+r,n))/(Math.pow(1+r,n)-1);
  const total = emi*n;
  const interest = total-p;
  result.style.display='block';
  result.style.color = COMPANY.color;
  result.innerHTML = `✅ EMI: <b>₹${Math.round(emi).toLocaleString('en-IN')}</b><br>
Total: ₹${Math.round(total).toLocaleString('en-IN')} | Interest: ₹${Math.round(interest).toLocaleString('en-IN')}`;
}

function addMsg(text, type) {
  const box = document.getElementById('chatBox');
  const div = document.createElement('div');
  div.className = `msg ${type}`;
  div.innerHTML = `
    <div class="msg-avatar">${type==='bot'?COMPANY.logo:'👤'}</div>
    <div class="msg-bubble">${text}</div>`;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function sendMsg() {
  const input = document.getElementById('userInput');
  const msg = input.value.trim();
  if (!msg) return;
  addMsg(msg, 'user');
  input.value = '';
  setTimeout(() => addMsg(getResponse(msg), 'bot'), 600);
}

function quickAsk(msg) {
  addMsg(msg, 'user');
  setTimeout(() => addMsg(getResponse(msg), 'bot'), 600);
}

window.onload = () => setLang('hi');
</script>
