<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LoanGuide AI</title>
<script>
// ════════════════════════════════════════
// COMPANY CONFIG — SIRF YAHAN CHANGE KARO
// ════════════════════════════════════════
const COMPANY = {
  name: "LoanGuide AI",           // Company naam
  logo: "💰",                      // Logo emoji ya image URL
  color: "#60a5fa",                // Brand color
  phone: "1800-XXX-XXXX",         // Phone number
  address: "Your City, India",     // Address
  website: "www.yoursite.com",     // Website
  tagline: "Free Loan Guidance • 24/7 Available",
  whatsapp: "91XXXXXXXXXX"        // WhatsApp number
};
// ════════════════════════════════════════
</script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #0a0a2e, #1a1a4e, #0d2137);
    min-height: 100vh;
    color: white;
  }
  .header {
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(10px);
    padding: 1rem 1.5rem;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }
  .logo { font-size: 2rem; }
  .header-text h1 { font-size: 1.3rem; font-weight: 700; }
  .header-text p { font-size: 0.75rem; }
  .badge {
    margin-left: auto;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
    color: #000;
  }
  .container { max-width: 700px; margin: 0 auto; padding: 1.5rem; }

  /* Company Contact Card */
  .company-card {
    border-radius: 16px;
    padding: 1rem 1.25rem;
    margin-bottom: 1.5rem;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.05);
  }
  .company-card-title {
    font-size: 11px;
    letter-spacing: 0.1em;
    color: rgba(255,255,255,0.4);
    margin-bottom: 10px;
  }
  .company-info {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }
  .info-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: rgba(255,255,255,0.8);
  }
  .info-icon { font-size: 14px; }
  .contact-btns {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-top: 12px;
  }
  .contact-btn {
    padding: 10px;
    border-radius: 10px;
    border: none;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .btn-call { background: #22c55e; color: white; }
  .btn-whatsapp { background: #25D366; color: white; }
  .btn-web { background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2) !important; }
  .btn-location { background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2) !important; }

  .loan-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-bottom: 1.5rem;
  }
  .loan-btn {
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 12px;
    padding: 12px;
    cursor: pointer;
    text-align: left;
    color: white;
    transition: all 0.2s;
  }
  .loan-btn .icon { font-size: 1.4rem; margin-bottom: 4px; }
  .loan-btn .name { font-size: 13px; font-weight: 600; }
  .loan-btn .desc { font-size: 11px; color: rgba(255,255,255,0.5); }
  .chat-box {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 1rem;
    min-height: 200px;
    max-height: 350px;
    overflow-y: auto;
    margin-bottom: 1rem;
  }
  .msg {
    margin-bottom: 12px;
    display: flex;
    gap: 8px;
    align-items: flex-start;
  }
  .msg.user { flex-direction: row-reverse; }
  .msg-bubble {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 13px;
    line-height: 1.6;
  }
  .msg.bot .msg-bubble {
    background: rgba(96,165,250,0.15);
    border: 1px solid rgba(96,165,250,0.3);
    color: #e0f0ff;
  }
  .msg.user .msg-bubble {
    background: rgba(99,102,241,0.3);
    border: 1px solid rgba(99,102,241,0.4);
  }
  .msg-avatar { font-size: 1.2rem; flex-shrink: 0; }
  .input-row { display: flex; gap: 8px; }
  .input-row input {
    flex: 1;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 12px;
    padding: 12px 16px;
    color: white;
    font-size: 14px;
    outline: none;
  }
  .input-row input::placeholder { color: rgba(255,255,255,0.35); }
  .send-btn {
    border: none;
    border-radius: 12px;
    padding: 12px 20px;
    font-weight: 700;
    cursor: pointer;
    font-size: 16px;
    color: #000;
  }
  .disclaimer {
    margin-top: 1rem;
    padding: 10px 14px;
    background: rgba(251,191,36,0.1);
    border: 1px solid rgba(251,191,36,0.3);
    border-radius: 10px;
    font-size: 11px;
    color: #fbbf24;
    text-align: center;
  }
  .section-label {
    font-size: 11px;
    color: rgba(255,255,255,0.4);
    letter-spacing: 0.1em;
    margin-bottom: 10px;
  }
  .emi-calculator {
    border-radius: 16px;
    padding: 1rem;
    margin-bottom: 1.5rem;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.05);
  }
  .emi-title { font-size: 14px; font-weight: 600; margin-bottom: 12px; }
  .emi-inputs {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 10px;
  }
  .emi-input {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 8px;
    padding: 8px;
    color: white;
    font-size: 12px;
    width: 100%;
    outline: none;
    text-align: center;
  }
  .emi-input::placeholder { color: rgba(255,255,255,0.3); font-size: 10px; }
  .calc-btn {
    width: 100%;
    border: none;
    border-radius: 8px;
    padding: 8px;
    font-weight: 700;
    cursor: pointer;
    font-size: 13px;
    color: #000;
  }
  .emi-result {
    margin-top: 10px;
    text-align: center;
    font-size: 13px;
    font-weight: 600;
    display: none;
  }
  .apply-btn {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: none;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 1rem;
    color: white;
  }
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }
</style>
</head>
<body>

<div class="header" id="header">
  <div class="logo" id="headerLogo"></div>
  <div class="header-text">
    <h1 id="headerName"></h1>
    <p id="headerTagline"></p>
  </div>
  <div class="badge" id="headerBadge">FREE</div>
</div>

<div class="container">

  <!-- Company Contact Card -->
  <div class="company-card" id="companyCard">
    <div class="company-card-title">HAMSE SEEDHA BAAT KAREIN</div>
    <div class="company-info">
      <div class="info-item">
        <span class="info-icon">📞</span>
        <span id="companyPhone"></span>
      </div>
      <div class="info-item">
        <span class="info-icon">🌐</span>
        <span id="companyWebsite"></span>
      </div>
      <div class="info-item" style="grid-column: span 2;">
        <span class="info-icon">📍</span>
        <span id="companyAddress"></span>
      </div>
    </div>
    <div class="contact-btns">
      <button class="contact-btn btn-call" id="btnCall">📞 Call Now</button>
      <button class="contact-btn btn-whatsapp" id="btnWhatsapp">💬 WhatsApp</button>
      <button class="contact-btn btn-web" id="btnWeb">🌐 Website</button>
      <button class="contact-btn btn-location" onclick="alert('Address: ' + COMPANY.address)">📍 Location</button>
    </div>
  </div>

  <!-- EMI Calculator -->
  <div class="emi-calculator">
    <div class="emi-title" id="emiTitle">🧮 EMI Calculator</div>
    <div class="emi-inputs">
      <input class="emi-input" id="principal" type="number" placeholder="Loan ₹">
      <input class="emi-input" id="rate" type="number" placeholder="Interest %">
      <input class="emi-input" id="tenure" type="number" placeholder="Months">
    </div>
    <button class="calc-btn" id="calcBtn" onclick="calcEMI()">Calculate EMI</button>
    <div class="emi-result" id="emiResult"></div>
  </div>

  <div class="section-label">LOAN TYPE CHUNIYE</div>

  <div class="loan-grid">
    <button class="loan-btn" onclick="quickAsk('Home loan ke baare mein batao')">
      <div class="icon">🏠</div>
      <div class="name">Home Loan</div>
      <div class="desc">Ghar kharidne ke liye</div>
    </button>
    <button class="loan-btn" onclick="quickAsk('Personal loan ke baare mein batao')">
      <div class="icon">👤</div>
      <div class="name">Personal Loan</div>
      <div class="desc">Kisi bhi zaroorat ke liye</div>
    </button>
    <button class="loan-btn" onclick="quickAsk('Business loan ke baare mein batao')">
      <div class="icon">🏢</div>
      <div class="name">Business Loan</div>
      <div class="desc">Business ke liye</div>
    </button>
    <button class="loan-btn" onclick="quickAsk('Education loan ke baare mein batao')">
      <div class="icon">🎓</div>
      <div class="name">Education Loan</div>
      <div class="desc">Padhai ke liye</div>
    </button>
    <button class="loan-btn" onclick="quickAsk('Car loan ke baare mein batao')">
      <div class="icon">🚗</div>
      <div class="name">Car Loan</div>
      <div class="desc">Gaadi ke liye</div>
    </button>
    <button class="loan-btn" onclick="quickAsk('Gold loan ke baare mein batao')">
      <div class="icon">🥇</div>
      <div class="name">Gold Loan</div>
      <div class="desc">Sone pe loan</div>
    </button>
    <button class="loan-btn" onclick="quickAsk('Mudra loan ke baare mein batao')">
      <div class="icon">🇮🇳</div>
      <div class="name">Mudra Loan</div>
      <div class="desc">Govt scheme</div>
    </button>
    <button class="loan-btn" onclick="quickAsk('Loan reject ho gaya kya karoon')">
      <div class="icon">❌</div>
      <div class="name">Loan Reject?</div>
      <div class="desc">Kya karein ab</div>
    </button>
  </div>

  <div class="chat-box" id="chatBox">
    <div class="msg bot">
      <div class="msg-avatar" id="botAvatar">💰</div>
      <div class="msg-bubble" id="welcomeMsg"></div>
    </div>
  </div>

  <div class="input-row">
    <input type="text" id="userInput"
      placeholder="Loan ke baare mein kuch bhi poochein..."
      onkeypress="if(event.key==='Enter') sendMsg()">
    <button class="send-btn" id="sendBtn" onclick="sendMsg()">➤</button>
  </div>

  <button class="apply-btn" id="applyBtn"
    onclick="window.open('https://wa.me/'+COMPANY.whatsapp+'?text=Mujhe loan ke baare mein jaankari chahiye', '_blank')">
    🚀 Abhi Apply Karein — Hamare Expert Se Baat Karein
  </button>

  <div class="disclaimer">
    ⚠️ Yeh general guidance hai. Final decision ke liye hamare expert se milein.
  </div>

</div>

<script>
// Apply company branding
window.onload = function() {
  document.getElementById('headerLogo').textContent = COMPANY.logo;
  document.getElementById('headerName').textContent = COMPANY.name;
  document.getElementById('headerTagline').textContent = COMPANY.tagline;
  document.getElementById('headerBadge').style.background = COMPANY.color;
  document.getElementById('sendBtn').style.background = COMPANY.color;
  document.getElementById('calcBtn').style.background = COMPANY.color;
  document.getElementById('applyBtn').style.background = COMPANY.color;
  document.getElementById('emiTitle').style.color = COMPANY.color;
  document.getElementById('companyPhone').textContent = COMPANY.phone;
  document.getElementById('companyWebsite').textContent = COMPANY.website;
  document.getElementById('companyAddress').textContent = COMPANY.address;
  document.getElementById('btnCall').onclick = () => window.open('tel:' + COMPANY.phone);
  document.getElementById('btnWhatsapp').onclick = () =>
    window.open('https://wa.me/' + COMPANY.whatsapp + '?text=Mujhe loan mein madad chahiye');
  document.getElementById('btnWeb').onclick = () =>
    window.open('https://' + COMPANY.website);
  document.getElementById('welcomeMsg').innerHTML =
    `Namaste! Main <b>${COMPANY.name}</b> ka AI assistant hoon. 🙏<br><br>
    Aap apna sawaal Hindi ya English mein poochein!<br><br>
    📞 Direct baat ke liye: <b>${COMPANY.phone}</b>`;
  document.getElementById('botAvatar').textContent = COMPANY.logo;
  document.title = COMPANY.name + ' - Loan Guidance';
};

const knowledge = {
  home: {
    keys: ['home loan','ghar','house','property','makaan','flat','plot'],
    response: `🏠 <b>Home Loan Guide:</b><br><br>
<b>Best Interest Rates:</b><br>
• SBI — 8.50% se shuru<br>
• HDFC — 8.75% se shuru<br>
• ICICI — 8.75% se shuru<br>
• LIC Housing — 8.50% se shuru<br><br>
<b>Documents:</b><br>
• Aadhar + PAN card<br>
• 6 mahine salary slip<br>
• 2 saal ITR<br>
• Property documents<br><br>
<b>Kitna milega:</b><br>
• Property value ka 80% tak<br>
• PMAY mein ₹2.67 lakh subsidy!<br><br>
<b>Hamare expert se baat karein 👇</b>`
  },
  personal: {
    keys: ['personal loan','personal','emergency','shaadi','wedding','travel','medical'],
    response: `👤 <b>Personal Loan Guide:</b><br><br>
<b>Interest Rates:</b><br>
• Banks — 10-15% per year<br>
• NBFCs — 12-24% per year<br><br>
<b>Eligibility:</b><br>
• Minimum salary ₹15,000/month<br>
• CIBIL score 700+<br>
• Age 21-58 years<br><br>
<b>Documents:</b><br>
• Aadhar + PAN<br>
• 3 month salary slip<br>
• Bank statement<br><br>
<b>Hamare expert se baat karein 👇</b>`
  },
  business: {
    keys: ['business loan','business','dukan','shop','startup','vyapar'],
    response: `🏢 <b>Business Loan Guide:</b><br><br>
<b>Best Options:</b><br>
• Mudra Loan — ₹10 lakh tak<br>
• CGTMSE — ₹2 crore tak<br>
• Bank Business Loan — 11-16%<br><br>
<b>Documents:</b><br>
• Business registration<br>
• GST certificate<br>
• 2 saal ITR<br>
• 12 month bank statement<br><br>
<b>Hamare expert se baat karein 👇</b>`
  },
  education: {
    keys: ['education loan','padhai','college','university','abroad','study'],
    response: `🎓 <b>Education Loan Guide:</b><br><br>
<b>India mein:</b><br>
• SBI Scholar — 8.15% (IIT/IIM)<br>
• ₹10 lakh tak — no collateral<br><br>
<b>Abroad ke liye:</b><br>
• ₹20-75 lakh tak<br>
• 10-14% interest<br><br>
<b>SC/ST students ko subsidy milti hai!</b><br><br>
<b>Hamare expert se baat karein 👇</b>`
  },
  car: {
    keys: ['car loan','car','vehicle','bike','gaadi','scooter'],
    response: `🚗 <b>Car Loan Guide:</b><br><br>
<b>Rates:</b><br>
• New car — 8.5-12%<br>
• Used car — 12-18%<br>
• Two wheeler — 9-16%<br><br>
<b>Kitna milega:</b><br>
• New car — 90% price<br>
• Used car — 80% value<br><br>
<b>Tip: Bank se lo — dealer se nahi!</b><br><br>
<b>Hamare expert se baat karein 👇</b>`
  },
  gold: {
    keys: ['gold loan','sona','gold','jewellery','zever'],
    response: `🥇 <b>Gold Loan — 30 minute mein!</b><br><br>
<b>Rates:</b><br>
• Banks — 8-12%<br>
• Muthoot — 12-24%<br><br>
<b>Kitna milega:</b><br>
• Gold value ka 75% tak<br>
• Sirf Aadhar chahiye!<br>
• CIBIL score nahi chahiye<br><br>
<b>Hamare expert se baat karein 👇</b>`
  },
  mudra: {
    keys: ['mudra','govt','government','scheme','sarkari','pm','pradhan mantri'],
    response: `🇮🇳 <b>Mudra Loan:</b><br><br>
• Shishu — ₹50,000 tak<br>
• Kishore — ₹5 lakh tak<br>
• Tarun — ₹10 lakh tak<br><br>
<b>No collateral! Low interest!</b><br>
Women ko extra benefit!<br><br>
<b>Hamare expert se baat karein 👇</b>`
  },
  reject: {
    keys: ['reject','rejection','nahi mila','refused','cibil','score'],
    response: `❌ <b>Loan Reject Hua? Ghabrao mat!</b><br><br>
<b>Kya karein:</b><br>
• CIBIL score check karo — free<br>
• Purana loan chukao pehle<br>
• Co-applicant add karo<br>
• 6 mahine baad dobara try karo<br><br>
<b>Hamare expert aapki help karenge!</b><br><br>
<b>Abhi call karein 👇</b>`
  }
};

function getResponse(msg) {
  const m = msg.toLowerCase();
  for (const [key, data] of Object.entries(knowledge)) {
    for (const kw of data.keys) {
      if (m.includes(kw)) {
        return data.response + `<br>
<button onclick="window.open('tel:${COMPANY.phone}')"
  style="margin-top:8px;padding:8px 16px;background:${COMPANY.color};
  color:#000;border:none;border-radius:8px;font-weight:700;cursor:pointer;font-size:12px;">
  📞 ${COMPANY.phone} pe Call Karein
</button>`;
      }
    }
  }
  return `💰 Aapka sawaal mila: "${msg}"<br><br>
Is baare mein hamare expert seedha help karenge!<br><br>
<button onclick="window.open('tel:${COMPANY.phone}')"
  style="margin-top:8px;padding:8px 16px;background:${COMPANY.color};
  color:#000;border:none;border-radius:8px;font-weight:700;cursor:pointer;font-size:12px;">
  📞 Abhi Call Karein: ${COMPANY.phone}
</button>`;
}

function calcEMI() {
  const p = parseFloat(document.getElementById('principal').value);
  const r = parseFloat(document.getElementById('rate').value) / 12 / 100;
  const n = parseFloat(document.getElementById('tenure').value);
  const result = document.getElementById('emiResult');
  if (!p || !r || !n) {
    result.style.display = 'block';
    result.style.color = '#fbbf24';
    result.innerHTML = '⚠️ Teenon fields bharein!';
    return;
  }
  const emi = (p * r * Math.pow(1+r,n)) / (Math.pow(1+r,n)-1);
  const total = emi * n;
  const interest = total - p;
  result.style.display = 'block';
  result.style.color = COMPANY.color;
  result.innerHTML = `✅ Monthly EMI: <b>₹${Math.round(emi).toLocaleString('en-IN')}</b><br>
Total: ₹${Math.round(total).toLocaleString('en-IN')} | Interest: ₹${Math.round(interest).toLocaleString('en-IN')}`;
}

function addMsg(text, type) {
  const box = document.getElementById('chatBox');
  const div = document.createElement('div');
  div.className = `msg ${type}`;
  div.innerHTML = `
    <div class="msg-avatar">${type==='bot' ? COMPANY.logo : '👤'}</div>
    <div class="msg-bubble">${text}</div>`;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function sendMsg() {
  const input = document.getElementById('userInput');
  const msg = input.value.trim();
  if (!msg) return;
  addMsg(msg, 'user');
  input.value = '';
  setTimeout(() => addMsg(getResponse(msg), 'bot'), 600);
}

function quickAsk(msg) {
  addMsg(msg, 'user');
  setTimeout(() => addMsg(getResponse(msg), 'bot'), 600);
}
</script>
</body>
  </html>
